name: FreeFinder cloud catalog

on:
  push:
    paths: ['backend/**', 'android/**', '.github/workflows/freefinder-cloud.yml']
  workflow_dispatch:
  schedule:
    # UTC. Run away from the top of the hour; source limits still apply.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: freefinder-cloud-catalog
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current code and public catalog state
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Set up Java for Android
        if: github.event_name == 'push'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: github.event_name == 'push'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build Android
        if: github.event_name == 'push'
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Enable emulator hardware acceleration
        if: github.event_name == 'push'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and capture actual Android screens
        if: github.event_name == 'push'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-smoke.sh
      - name: Save emulator diagnostics
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-screens
          path: public/screenshots
          if-no-files-found: ignore
      - name: Stage Android downloads
        run: |
          mkdir -p public/downloads
          for version in 0.2.0 0.3.0 0.3.1 0.4.0; do
            target="public/downloads/freefinder-$version.apk"
            if curl --fail --location --retry 2 --max-time 90 "https://victorvnn.github.io/freefinder/downloads/freefinder-$version.apk" -o "$target"; then
              echo "Preserving published $version APK"
            elif [ "$version" = '0.4.0' ] && [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
              cp android/app/build/outputs/apk/debug/app-debug.apk "$target"
            else
              rm -f "$target"
            fi
          done
      - name: Discover and export actual observed offers
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/freefinder-cloud-job.db
          LOCK_FILE: /tmp/freefinder-cloud-job.lock
          SCAN_HOURS: '6'
        run: python -m app.cloud --state ../cloud/state.json --output ../public
      - name: Persist public metadata for next scheduled run
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cloud/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update FreeFinder public catalog state'
            bash cloud/push-state.sh "$DEFAULT_BRANCH"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only generated public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish catalog
        id: deployment
        uses: actions/deploy-pages@v4
