name: FreeFinder cloud catalog

on:
  push:
    paths: ['backend/**', 'android/**', '.github/workflows/freefinder-cloud.yml']
  workflow_dispatch:
  schedule:
    # UTC. Run away from the top of the hour; source limits still apply.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: freefinder-cloud-catalog
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current code and public catalog state
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Set up Java for Android
        if: github.event_name == 'push'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: github.event_name == 'push'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build Android
        if: github.event_name == 'push'
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Stage Android download
        run: |
          mkdir -p public/downloads
          # Keep this version's published signature stable; never overwrite it.
          if curl --fail --location --retry 2 --max-time 90 'https://victorvnn.github.io/freefinder/downloads/freefinder-0.2.0.apk' -o public/downloads/freefinder-0.2.0.apk; then
            echo 'Preserving published 0.2.0 APK'
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/freefinder-0.2.0.apk
          else
            rm -f public/downloads/freefinder-0.2.0.apk
          fi
      - name: Discover and export actual observed offers
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/freefinder-cloud-job.db
          LOCK_FILE: /tmp/freefinder-cloud-job.lock
          SCAN_HOURS: '6'
        run: python -m app.cloud --state ../cloud/state.json --output ../public
      - name: Persist public metadata for next scheduled run
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cloud/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update FreeFinder public catalog state'
            bash cloud/push-state.sh "$DEFAULT_BRANCH"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only generated public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish catalog
        id: deployment
        uses: actions/deploy-pages@v4
